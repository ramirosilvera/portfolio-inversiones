name: Debug fuentes macro (temporal)
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar fuentes desde un runner
        run: |
          UA="Mozilla/5.0 (compatible; portfolio-inversiones)"
          probar() { # etiqueta, url, [opciones curl]
            local E="$1" U="$2"; shift 2
            local OUT; OUT=$(curl -sS --max-time 25 -A "$UA" -w '\n__HTTP %{http_code} %{content_type} %{size_download}B' "$@" "$U" 2>&1 | tail -c 1500)
            echo "── $E"; echo "$OUT" | head -c 160 | tr '\n' ' '; echo; echo "   …$(echo "$OUT" | tail -n 3 | tr '\n' ' ' | tail -c 200)"
          }
          probar "FRED csv h2"            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS"
          probar "FRED csv http1.1"       "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS" --http1.1
          probar "FRED csv cosd http1.1"  "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS&cosd=2026-09-01" --http1.1
          probar "FRED data txt"          "https://fred.stlouisfed.org/data/VIXCLS.txt" --http1.1
          probar "FRED series page"       "https://fred.stlouisfed.org/series/VIXCLS" --http1.1
          probar "Cboe VIX history"       "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"
          probar "Treasury yield curve"   "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv"
          probar "Yahoo ^VIX"             "https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX?interval=1d&range=5d"
          probar "Yahoo ^TNX"             "https://query1.finance.yahoo.com/v8/finance/chart/%5ETNX?interval=1d&range=5d"
          probar "Yahoo ^IRX"             "https://query1.finance.yahoo.com/v8/finance/chart/%5EIRX?interval=1d&range=5d"
          probar "Stooq ^vix"             "https://stooq.com/q/l/?s=%5Evix&f=sd2t2ohlcv&h&e=csv"
