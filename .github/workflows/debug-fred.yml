name: Debug fuentes macro (temporal)
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Probar FRED con otros clientes
        run: |
          BR="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          p() { E="$1"; U="$2"; shift 2; R=$(curl -sS --max-time 12 -o /tmp/o -w '%{http_code} %{content_type} %{size_download}B' "$@" "$U" 2>&1 | tail -c 200); echo "── $E → $R | $(head -c 120 /tmp/o 2>/dev/null | tr '\n' ' ')"; }
          p "FRED home (UA browser)"        "https://fred.stlouisfed.org/" -A "$BR"
          p "FRED csv VIX (UA browser)"     "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS" -A "$BR"
          p "FRED csv VIX (curl default)"   "https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS"
          p "FRED csv HY (UA browser)"      "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2" -A "$BR"
          p "FRED csv DTWEXBGS (browser)"   "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTWEXBGS" -A "$BR"
          p "FRED api sin clave"            "https://api.stlouisfed.org/fred/series/observations?series_id=VIXCLS&file_type=json" -A "$BR"
          p "ALFRED csv"                    "https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=VIXCLS" -A "$BR"
          p "Yahoo DX-Y.NYB"                "https://query1.finance.yahoo.com/v8/finance/chart/DX-Y.NYB?interval=1d&range=5d" -A "$BR"
          p "Yahoo HYG"                     "https://query1.finance.yahoo.com/v8/finance/chart/HYG?interval=1d&range=5d" -A "$BR"
